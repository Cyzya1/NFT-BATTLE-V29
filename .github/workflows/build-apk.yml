name: NFT BATTLE V29 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "NFT_BATTLE_BIG_UPDATE_WIP_V29.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract V29 project
        id: project
        shell: bash
        run: |
          ARCHIVE="NFT_BATTLE_BIG_UPDATE_WIP_V29.zip"
          BASE="$RUNNER_TEMP/nft-battle-v29"

          if [ ! -s "$ARCHIVE" ]; then
            echo "::error::V29 ZIP archive is missing or empty"
            ls -la
            exit 1
          fi

          mkdir -p "$BASE"
          unzip -q "$ARCHIVE" -d "$BASE"

          SETTINGS="$(find "$BASE" -type f -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle was not found inside the ZIP"
            find "$BASE" -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle was not found"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::APK was not created by Gradle"
            find "$PROJECT_DIR" -type d -path '*/build/outputs/*' -print || true
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-V29-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
