name: NFT BATTLE V29 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Locate and extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/NFT_BATTLE_BIG_UPDATE_WIP_V29(2).zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Required project archive not found: NFT_BATTLE_BIG_UPDATE_WIP_V29(2).zip. Put this exact file in the repository root."
            exit 1
          fi

          echo "Using project archive: $(basename "$ARCHIVE")"
          unzip -tq "$ARCHIVE"
          EXTRACT_DIR="$RUNNER_TEMP/nft-battle-v29"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::settings.gradle was not found inside the ZIP archive."
            find "$EXTRACT_DIR" -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          REQUIRED_FILES=(
            "$PROJECT_DIR/build.gradle"
            "$PROJECT_DIR/app/build.gradle"
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
            "$PROJECT_DIR/app/src/main/java/com/suzuya/nftbattle/MainActivity.java"
            "$PROJECT_DIR/app/src/main/assets/index.html"
          )
          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -s "$FILE" ]]; then
              echo "::error::Required project file is missing or empty: $FILE"
              exit 1
            fi
          done

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace --project-dir "$PROJECT_DIR" :app:assembleDebug

      - name: Locate APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "::error::Gradle finished but APK was not found. Build output:"
            find "$PROJECT_DIR/app/build/outputs" -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK created: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-V29-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

