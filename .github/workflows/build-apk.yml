
name: Build NFT BATTLE V29 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NFT_BATTLE_BIG_UPDATE_WIP_V29.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract V29 project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="NFT_BATTLE_BIG_UPDATE_WIP_V29.zip"

          test -f "$ARCHIVE" || {
            echo "ERROR: V29 ZIP not found in repository root"
            ls -la
            exit 1
          }

          BASE="$RUNNER_TEMP/nft-battle-v29"
          mkdir -p "$BASE"
          unzip -q "$ARCHIVE" -d "$BASE"

          PROJECT="$(find "$BASE" -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)"

          if [[ -z "$PROJECT" ]]; then
            echo "ERROR: Android Gradle project not found in V29 ZIP"
            find "$BASE" -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-V29-APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
