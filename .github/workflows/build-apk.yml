
name: Build NFT BATTLE V29 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "NFT_BATTLE_BIG_UPDATE_WIP_V29.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract V29 project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="NFT_BATTLE_BIG_UPDATE_WIP_V29.zip"
          BASE="$RUNNER_TEMP/nft-battle-v29"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::V29 ZIP not found"
            exit 1
          fi

          mkdir -p "$BASE"
          unzip -q "$ARCHIVE" -d "$BASE"

          SETTINGS="$(find "$BASE" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle project not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::gradlew not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-V29-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
