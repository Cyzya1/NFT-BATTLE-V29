name: NFT BATTLE V29 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NFT_BATTLE_BIG_UPDATE_WIP_V29.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/NFT_BATTLE_BIG_UPDATE_WIP_V29.zip"
          EXTRACT_DIR="$RUNNER_TEMP/nft-battle-v29"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::NFT_BATTLE_BIG_UPDATE_WIP_V29.zip was not found in repository root"
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"

          PROJECT_DIR="$(find "$EXTRACT_DIR" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Could not find settings.gradle or settings.gradle.kts in the ZIP"
            find "$EXTRACT_DIR" -maxdepth 4 -type f -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --project-dir "$PROJECT_DIR" assembleDebug

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "::error::APK was not generated"
            find "$PROJECT_DIR" -type d -path '*/build/outputs/*' -print || true
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK found: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-V29-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
